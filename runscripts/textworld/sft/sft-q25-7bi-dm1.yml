name: sdp-textworlds-q25-7b-sft-dm1
image: isadoracw/llama-factory-mc:latest
compute:
    gpus: 8
    cluster: r8z13p1
scheduling:
  priority: lowest
  resumable: false
  preemptible: true
integrations:
  - integration_type: wandb
    project: sdp_textworld_sft
    entity: lucasdino-ucsd
env_variables:
  S3_DATASET_PATH:  "s3://seq-dec-proc/sft_data/sft_dm1/"
  YAML_CONFIG_FILE: "tasks/training_configs/llamafactory_sdp_sft_qwen25_dm1.yaml"
  SAVE_FOLDER_NAME: "sdp_q25_7b_dm1"
command: |-
  # ------------------------------
  # Download/install dependencies
  # ------------------------------
  mkdir home
  cd home
  git clone --recurse-submodules https://github.com/lucasdino/sequential-decision-processors.git
  cd sequential-decision-processors/sequential_decision_processors

  pip install uv
  uv venv .venv
  source .venv/bin/activate
  uv sync
  apt-get update && apt-get install -y libgl1-mesa-glx
  uv add opencv-python
  uv add wandb
  uv pip install "deepspeed==0.16.9"
  uv pip install "datasets==4.0.0"

  # ------------------------------
  # Generate our dataset
  # ------------------------------
  aws s3 sync $S3_DATASET_PATH data

  # ------------------------------
  # Download and install llamafactory
  # ------------------------------
  git clone --depth 1 https://github.com/hiyouga/LLaMA-Factory.git
  cd LLaMA-Factory
  uv pip install -e ".[torch,metrics]"
  cd ..

  # ------------------------------
  # Train (using yaml as config)
  # ------------------------------
  llamafactory-cli train $YAML_CONFIG_FILE

  # ------------------------------
  # Save trained model to S3
  # ------------------------------
  # Save the trained model to S3
  aws s3 cp sft-model/ s3://seq-dec-proc/sft_models/$SAVE_FOLDER_NAME --recursive \
  --exclude "*" \
  --include "model-*.safetensors" \
  --include "model.safetensors.index.json" \
  --include "config.json" \
  --include "tokenizer.json" \
  --include "tokenizer_config.json" \
  --include "special_tokens_map.json" \
  --include "generation_config.json"
  --include "chat_template.jinja" \
  --include "added_tokens.json" \
  --include "vocab.json" \
  --include "merges.txt"

  echo "Training complete and model saved to S3"
  sleep 45