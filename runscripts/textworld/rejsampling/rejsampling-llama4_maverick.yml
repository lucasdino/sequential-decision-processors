name: llmchess-llama4-maverick-rejectionsampling
image: lucasdino/llm_chess:latest
compute:
    gpus: 8
    cluster: r8z13p1
scheduling:
  priority: lowest
  resumable: false
  preemptible: true
integrations:
  - integration_type: git_repo
    git_repo: lucasdino/llm_chess
    git_branch: main
  - integration_type: wandb
    project: llm-chess-rejsampling
    entity: lucasdino-ucsd
env_variables:
  SH_FILE: "verl-qwen25-7b-sft-dm36-drgrpo-dm10.sh"
  EXPERIMENT_NAME: "qwen25_7b_test"
command: |-
  # Get env set up on cluster (in /home/...)
  cd home
  git clone --recurse-submodules https://github.com/lucasdino/sequential-decision-processors.git
  cd sequential-decision-processors/verl_dead_agent

  pip install uv
  uv venv .venv
  source .venv/bin/activate
  uv add wheel packaging
  uv add flash-attn==2.7.4.post1 --no-build-isolation

  # Download our alfworld data
  alfworld-download -f

  # Run our rejsampling script
  mv runscripts verl_dead_agent/
  cd verl_dead_agent
  chmod +x runscripts/*.sh
  runscripts/textworld/$SH_FILE

  # Save down rejsample data
  pip install --no-cache-dir awscli
  aws s3 cp /home/sequential-decision-processors/rej_sampling_data s3://sdp/rej_sampling_data/$EXPERIMENT_NAME --recursive